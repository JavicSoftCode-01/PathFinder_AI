{% extends '../core/components/base.html' %}
{% load static %}

{% block content %}
  <style>
      :root {
          --bg-gradient-start: #3b206b;
          --bg-gradient-end: #5d33a3;
          --text-color: #ffffff;
          --btn-read-bg: #9acd32;
          --btn-pause-bg: #808080;
          --btn-repeat-bg: #87ceeb;
          --btn-back-bg: #c94c4c;
          --focus-outline: #f0e68c;
          --status-bg: rgba(0, 0, 0, 0.5);
      }

      .reader-container {
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          flex-grow: 1;
          padding: 20px;
          box-sizing: border-box;
          width: 100%;
          max-width: 900px;
          margin: 0 auto;
          text-align: center;
      }

      .reader-title {
          font-size: 2rem;
          font-weight: bold;
          text-transform: uppercase;
          margin-bottom: 5px;
      }

      .reader-subtitle {
          font-size: 1.2rem;
          margin-bottom: 20px;
          opacity: 0.9;
      }

      .camera-container {
          position: relative;
          width: 100%;
          max-width: 640px;
          background-color: #000;
          border: 8px solid #666;
          border-radius: 20px;
          overflow: hidden;
          margin-bottom: 20px;
          min-height: 360px;
          display: flex;
          justify-content: center;
          align-items: center;
      }

      #video-feed {
          width: 100%;
          height: auto;
          display: block;
      }

      .loader {
          position: absolute;
          border: 8px solid #f3f3f3;
          border-top: 8px solid var(--btn-read-bg);
          border-radius: 50%;
          width: 60px;
          height: 60px;
          animation: spin 1s linear infinite;
          display: none;
      }

      @keyframes spin {
          0% {
              transform: rotate(0deg);
          }
          100% {
              transform: rotate(360deg);
          }
      }

      .status-bar {
          background-color: var(--status-bg);
          padding: 10px 20px;
          border-radius: 25px;
          margin-bottom: 20px;
          width: 100%;
          max-width: 640px;
      }

      #status-text {
          color: var(--focus-outline);
          font-weight: bold;
          margin-bottom: 5px;
      }

      #detected-text {
          font-size: 1.1rem;
          min-height: 20px;
      }

      .controls {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 15px;
          width: 100%;
      }

      .btn-reader {
          border: none;
          padding: 15px 25px;
          font-size: 1rem;
          font-weight: bold;
          border-radius: 10px;
          cursor: pointer;
          transition: transform 0.2s;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
      }

      .btn-reader:disabled {
          cursor: not-allowed;
          opacity: 0.6;
      }

      .btn-read {
          background-color: var(--btn-read-bg);
          color: #333;
      }

      .btn-pause {
          background-color: var(--btn-pause-bg);
          color: white;
      }

      .btn-repeat {
          background-color: var(--btn-repeat-bg);
          color: #333;
      }

      .btn-back {
          background-color: var(--btn-back-bg);
          color: white;
          text-decoration: none;
          border-radius: 25px;
      }
  </style>

  <div class="reader-container">
    <h1 class="reader-title">Lectura de Textos</h1>
    <p class="reader-subtitle">Apunta la cámara y presiona "Capturar texto"</p>
    <div class="camera-container">
      <video id="video-feed" playsinline muted autoplay></video>
      <div class="loader" id="loader"></div>
    </div>
    <div class="status-bar">
      <p id="status-text">Cámara inactiva</p>
      <p id="detected-text">Texto detectado: ...</p>
    </div>
    <div class="controls">
      <button class="btn-reader btn-read" id="main-button">▷ Activar cámara</button>
      <button class="btn-reader btn-pause" id="btn-pause" disabled>❚❚ Pausar</button>
      <button class="btn-reader btn-repeat" id="btn-repeat" disabled>🔁 Repetir</button>
      <a href="{% url 'auth_api:core:home' %}" class="btn-reader btn-back" id="btn-back">🏠 Volver al menú principal</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const video = document.getElementById('video-feed');
      const statusText = document.getElementById('status-text');
      const detectedText = document.getElementById('detected-text');
      const mainButton = document.getElementById('main-button');
      const btnPause = document.getElementById('btn-pause');
      const btnRepeat = document.getElementById('btn-repeat');
      const loader = document.getElementById('loader');

      const synthesis = window.speechSynthesis;
      let isCameraOn = false;
      let isProcessing = false;
      let stream;
      let lastApiResultText = "";
      let speechQueue = [];
      let currentIndex = 0;
      let isPausedManually = false;

      // --- FUNCIONES DE VOZ ---
      function splitText(text) {
        return text.split(/(?<=[.!?])\s+/); // Divide en oraciones
      }

      function speakFrom(index = 0, onEndCallback = () => {
      }) {
        if (index >= speechQueue.length) {
          btnPause.disabled = true;
          statusText.textContent = isCameraOn ? 'Cámara activa. Listo para capturar.' : 'Cámara inactiva.';
          onEndCallback();
          return;
        }

        const utterance = new SpeechSynthesisUtterance(speechQueue[index]);
        utterance.lang = 'es-ES';
        utterance.rate = 1;

        utterance.onstart = () => {
          statusText.textContent = 'Leyendo...';
          btnPause.disabled = false;
          btnPause.textContent = '❚❚ Pausar';
        };

        utterance.onend = () => {
          if (!isPausedManually) {
            currentIndex = index + 1;
            if (currentIndex < speechQueue.length) {
              speakFrom(currentIndex, onEndCallback);
            } else {
              btnPause.disabled = true;
              btnRepeat.disabled = false;
              statusText.textContent = 'Lectura finalizada.';
              onEndCallback();
            }
          }
        };

        utterance.onerror = (e) => console.error("Error TTS:", e);
        synthesis.speak(utterance);
      }

      function startSpeaking(text, onEndCallback = () => {
      }) {
        if (synthesis.speaking) synthesis.cancel();
        speechQueue = splitText(text);
        currentIndex = 0;
        isPausedManually = false;
        speakFrom(0, onEndCallback);
      }

      function pauseSpeaking() {
        if (synthesis.speaking) {
          synthesis.cancel(); // Detenemos TTS (no pausa real)
          isPausedManually = true;
          statusText.textContent = 'Lectura en pausa...';
          btnPause.textContent = '▶ Reanudar';
        }
      }

      function resumeSpeaking() {
        if (isPausedManually && currentIndex < speechQueue.length) {
          isPausedManually = false;
          statusText.textContent = 'Reanudando lectura...';
          btnPause.textContent = '❚❚ Pausar';
          speakFrom(currentIndex);
        }
      }

      // --- CÁMARA ---
      async function startCamera() {
        mainButton.disabled = true;
        statusText.textContent = 'Iniciando cámara...';
        try {
          stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
          video.srcObject = stream;
          await video.play();
          isCameraOn = true;
          mainButton.textContent = '📸 Capturar texto';
          mainButton.disabled = false;
          statusText.textContent = 'Cámara activa. Apunte y presione "Capturar texto".';
          startSpeaking("Cámara activada. Apunte y presione el botón para capturar el texto.");
        } catch (err) {
          console.error("Error al acceder a la cámara:", err);
          statusText.textContent = 'Error al acceder a la cámara.';
          mainButton.textContent = '▷ Reintentar activar cámara';
          mainButton.disabled = false;
          startSpeaking("No se pudo acceder a la cámara. Por favor, revise los permisos en su navegador.");
        }
      }

      function stopCameraAndSpeech() {
        synthesis.cancel();
        if (stream) stream.getTracks().forEach(track => track.stop());
        video.srcObject = null;
        isCameraOn = false;
        isProcessing = false;
        lastApiResultText = "";
        speechQueue = [];
        currentIndex = 0;
        mainButton.textContent = '▷ Activar cámara';
        mainButton.disabled = false;
        statusText.textContent = 'Cámara inactiva';
        btnPause.disabled = true;
        btnRepeat.disabled = true;
        loader.style.display = 'none';
      }

      // --- IA ---
      async function captureAndProcessFrame() {
        if (!isCameraOn || isProcessing || video.readyState < 2) return;

        isProcessing = true;
        mainButton.disabled = true;
        loader.style.display = 'block';
        statusText.textContent = 'Analizando imagen con la IA...';
        detectedText.textContent = "Texto detectado: ...";
        lastApiResultText = "";
        btnPause.disabled = true;
        btnRepeat.disabled = true;
        synthesis.cancel();

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = canvas.toDataURL('image/jpeg');

        try {
          const response = await fetch(window.location.href, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({image_data: imageData}),
          });

          loader.style.display = 'none';

          if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.error || `Error del servidor: ${response.status}`);
          }

          const result = await response.json();
          const newText = result.text || "No se detectó texto o contenido.";
          lastApiResultText = newText;
          detectedText.textContent = `Resultado: "${newText}"`;

          startSpeaking(newText, () => {
            startSpeaking("Vuelva a capturar otro texto si lo desea.", () => {
              isProcessing = false;
              mainButton.disabled = false;
            });
          });

        } catch (error) {
          console.error("Error procesando el frame:", error);
          const errorMessage = `Ocurrió un error: ${error.message}`;
          loader.style.display = 'none';
          statusText.textContent = errorMessage;
          startSpeaking(errorMessage, () => {
            isProcessing = false;
            mainButton.disabled = false;
          });
        }
      }

      // --- EVENTOS ---
      mainButton.addEventListener('click', () => {
        isCameraOn ? captureAndProcessFrame() : startCamera();
      });

      btnPause.addEventListener('click', () => {
        if (!isPausedManually) {
          pauseSpeaking();
        } else {
          resumeSpeaking();
        }
      });

      btnRepeat.addEventListener('click', () => {
        if (lastApiResultText) startSpeaking(lastApiResultText);
      });

      window.addEventListener('pagehide', stopCameraAndSpeech);

      startSpeaking("Bienvenido al módulo de lectura. Presione 'Activar cámara' para empezar.");
    });
  </script>

{% endblock %}
