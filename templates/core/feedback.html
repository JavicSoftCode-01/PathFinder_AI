{% extends './components/base.html' %}
{% load static %}

{% block content %}
  <style>
      :root {
          --primary-bg: #4c2a85;
          --text-color: #ffffff;
          --btn-yes-bg: #9acd32;
          --btn-no-bg: #4f4f6b;
          --btn-comment-bg: #3a3a5a;
          --btn-back-bg: #c94c4c;
          --focus-outline: #f0e68c;
      }

      /* Contenedor principal para centrar el contenido vertical y horizontalmente */
      .main-content-container {
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          flex-grow: 1;
          padding: 20px;
          box-sizing: border-box;
      }

      .feedback-container {
          width: 100%;
          max-width: 600px;
          text-align: center;
      }

      .feedback-title {
          font-size: 2rem;
          font-weight: bold;
          text-transform: uppercase;
          margin-bottom: 25px;
      }

      .question-wrapper {
          font-size: 1.5rem;
          margin-bottom: 35px;
      }

      .buttons-choice {
          display: flex;
          justify-content: center;
          gap: 15px;
          margin-bottom: 30px;
      }

      .btn {
          border: none;
          color: var(--text-color);
          padding: 18px; /* Padding aumentado para mejor tacto */
          font-size: 1.2rem;
          font-weight: bold;
          border-radius: 8px;
          cursor: pointer;
          transition: transform 0.2s, box-shadow 0.2s;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 10px;
          flex-grow: 1;
          max-width: 250px;
      }

      .btn:hover {
          transform: translateY(-3px);
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }

      .btn-yes {
          background-color: var(--btn-yes-bg);
      }

      .btn-no {
          background-color: var(--btn-no-bg);
      }

      /* Estilo visual para el botón seleccionado por el usuario */
      .btn.selected {
          outline: 4px solid var(--focus-outline);
          transform: scale(1.05);
      }

      .btn-submit, .btn-back {
          text-decoration: none;
          margin: 15px auto;
          width: 100%;
          max-width: 515px;
      }

      .btn-submit {
          background-color: var(--btn-comment-bg);
      }

      .btn-back {
          background-color: var(--btn-back-bg);
          border-radius: 50px;
      }

      /* El textarea está oculto, solo se usa para almacenar el comentario de voz */
      #id_comment {
          display: none;
      }

      @media (max-width: 768px) {
          .feedback-title {
              font-size: 1.6rem;
              margin-bottom: 20px;
          }

          .question-wrapper {
              font-size: 1.3rem;
          }

          .btn {
              font-size: 1.1rem;
              padding: 20px;
          }
      }
  </style>

  <div class="main-content-container">
    <div class="feedback-container">
      <h1 class="feedback-title" id="feedback-title-text">Módulo de Retroalimentación del Usuario</h1>

      <form method="post" id="feedback-form" novalidate>
        {% csrf_token %}
        <input type="radio" id="responded_yes" name="responded_correctly" value="True" required style="display: none;">
        <input type="radio" id="responded_no" name="responded_correctly" value="False" required style="display: none;">

        <!-- Este textarea invisible almacenará el comentario de voz -->
        {{ form.comment }}

        <div class="question-wrapper" id="question-text">
          <span>¿El asistente respondió correctamente a tu comando?</span>
        </div>

        <div class="buttons-choice">
          <button type="button" class="btn btn-yes" id="btn-yes">✓ SI</button>
          <button type="button" class="btn btn-no" id="btn-no">X NO</button>
        </div>

        <button type="submit" class="btn btn-submit">💬 Enviar comentarios</button>
      </form>

      <a href="{% url 'auth_api:core:home' %}" class="btn btn-back">🏠 Volver al menú principal</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('feedback-form');
      const btnYes = document.getElementById('btn-yes');
      const btnNo = document.getElementById('btn-no');
      const radioYes = document.getElementById('responded_yes');
      const radioNo = document.getElementById('responded_no');
      const commentTextarea = document.getElementById('id_comment');

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const synthesis = window.speechSynthesis;

      if (!SpeechRecognition || !synthesis) {
        console.error("Las APIs de Voz no son compatibles con este navegador.");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'es-ES';

      let userChoiceMade = false;
      let isWaitingForOpinionConfirmation = false;
      let isCapturingComment = false;

      function speak(text, onEndCallback = () => {
      }) {
        recognition.stop();
        if (synthesis.speaking) synthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-ES';
        utterance.onend = onEndCallback;
        synthesis.speak(utterance);
      }

      const vibrateDevice = () => {
        if ('vibrate' in navigator) navigator.vibrate(100);
      };

      speak("Módulo de Retroalimentación del Usuario", () => {
        setTimeout(() => {
          speak("¿El asistente respondió correctamente a tu comando?", () => {
            setTimeout(() => {
              speak("El botón SI está a la izquierda y el botón NO a la derecha.");
            }, 500);
          });
        }, 2000);
      });

      function handleChoice(isCorrect) {
        if (userChoiceMade) return;
        userChoiceMade = true;

        vibrateDevice();
        btnYes.classList.toggle('selected', isCorrect);
        btnNo.classList.toggle('selected', !isCorrect);
        radioYes.checked = isCorrect;
        radioNo.checked = !isCorrect;

        promptForVerbalFeedback();
      }

      btnYes.addEventListener('click', () => handleChoice(true));
      btnNo.addEventListener('click', () => handleChoice(false));

      function promptForVerbalFeedback() {
        isWaitingForOpinionConfirmation = true;
        isCapturingComment = false;
        recognition.continuous = false;
        recognition.interimResults = false;
        const prompt = '¿Desea dar su opinión? responda SI o NO. Si su respuesta es SI, para finalizar la opinión diga terminar.';
        speak(prompt, () => recognition.start());
      }

      function startCommentCapture() {
        isWaitingForOpinionConfirmation = false;
        isCapturingComment = true;
        recognition.continuous = true;
        recognition.interimResults = true;
        speak("Continúe con su opinión.", () => recognition.start());
      }

      // --- CORRECCIÓN PRINCIPAL APLIACADA AQUÍ ---
      recognition.onresult = (event) => {
        if (isWaitingForOpinionConfirmation) {
          const transcript = event.results[0][0].transcript.trim().toLowerCase();
          if (transcript.includes('sí') || transcript.includes('si')) {
            isWaitingForOpinionConfirmation = false;
            recognition.stop();
            startCommentCapture();
          } else if (transcript.includes('no')) {
            isWaitingForOpinionConfirmation = false;
            recognition.stop();
            submitForm(true);
          }
        } else if (isCapturingComment) {
          // Este es el método robusto para construir la transcripción sin duplicados.
          const transcript = Array.from(event.results)
            .map(result => result[0])
            .map(alternative => alternative.transcript)
            .join('');

          commentTextarea.value = transcript;

          // Verificamos si la última parte del resultado es final y contiene "terminar"
          const lastResult = event.results[event.results.length - 1];
          if (lastResult.isFinal && transcript.toLowerCase().includes('terminar')) {
            isCapturingComment = false;
            recognition.stop();
            const finalComment = commentTextarea.value.replace(/terminar/gi, '').trim();
            commentTextarea.value = finalComment;
            speak("Su opinión se almacenó. De clic en el botón de enviar comentarios.");
          }
        }
      };

      recognition.onerror = (event) => {
        console.error("Error en reconocimiento de voz:", event.error);
        isWaitingForOpinionConfirmation = false;
        isCapturingComment = false;
      };

      function submitForm(isAutomatic = false) {
        if (!radioYes.checked && !radioNo.checked) {
          speak("Por favor, seleccione una opción antes de enviar.");
          return;
        }
        const message = isAutomatic ? "Retroalimentación guardada." : "Retroalimentación enviada. Gracias.";
        speak(message, () => {
          setTimeout(() => form.submit(), 200);
        });
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        submitForm(false);
      });
    });
  </script>
{% endblock %}
